# 第三方数据库配置（用于仓库数据同步）
third-party:
  datasource:
    # 第三方数据库JDBC连接地址（根据实际情况修改）
    url: jdbc:mysql://localhost:3306/third_party_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    # 数据库用户名
    username: root
    # 数据库密码
    password: your_password
    # 驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 仓库同步SQL（根据第三方数据库表结构调整）
    # 返回字段别名必须为: id, code, name, address, contact_person, contact_phone, status
    warehouse-sql: >
      SELECT id, code, name, address, contact_person, contact_phone, status
      FROM warehouse
      WHERE status = '0'

  # Oracle数据库配置（用于资产数据同步）
  oracle:
    # Oracle JDBC连接地址
    url: jdbc:oracle:thin:@192.200.45.173:1521:orcl
    # 数据库用户名
    username: IWELL_HZQS
    # 数据库密码
    password: your_password
    # 驱动类名
    driver-class-name: oracle.jdbc.OracleDriver
    # 资产同步SQL
    asset-sql: >
      SELECT ID, KPBH, WZMC, GGXH, DJ, KSMC, ZT, BAR_CODE, PPMC, BZ, BGRXM, GRRQ, FLID
      FROM IN_ASSET
      WHERE ZFBZ = 0
