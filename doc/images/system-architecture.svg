<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" fill="#303133">系统架构图</text>

  <!-- Presentation Layer -->
  <rect x="50" y="80" width="900" height="100" rx="8" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="80" y="110" font-family="Microsoft YaHei, Arial" font-size="14" fill="#1890ff">表示层 (Presentation Layer)</text>

  <!-- Presentation Layer Items -->
  <rect x="80" y="120" width="150" height="45" rx="6" fill="#ffffff" stroke="#91d5ff"/>
  <text x="155" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">Web浏览器</text>
  <text x="155" y="162" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#999999">Chrome/Firefox/Edge</text>

  <rect x="260" y="120" width="150" height="45" rx="6" fill="#ffffff" stroke="#91d5ff"/>
  <text x="335" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">微信小程序</text>
  <text x="335" y="162" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#999999">移动端访问</text>

  <rect x="440" y="120" width="150" height="45" rx="6" fill="#ffffff" stroke="#91d5ff"/>
  <text x="515" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">Vue.js前端</text>
  <text x="515" y="162" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#999999">Element UI</text>

  <rect x="620" y="120" width="150" height="45" rx="6" fill="#ffffff" stroke="#91d5ff"/>
  <text x="695" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">响应式布局</text>
  <text x="695" y="162" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#999999">PC/移动端适配</text>

  <rect x="800" y="120" width="130" height="45" rx="6" fill="#ffffff" stroke="#91d5ff"/>
  <text x="865" y="148" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">用户界面</text>
  <text x="865" y="162" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#999999">交互设计</text>

  <!-- Arrow -->
  <text x="500" y="200" text-anchor="middle" font-family="Arial" font-size="20" fill="#1890ff">⬇ ⬆</text>

  <!-- Business Layer -->
  <rect x="50" y="220" width="900" height="100" rx="8" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="80" y="250" font-family="Microsoft YaHei, Arial" font-size="14" fill="#52c41a">业务逻辑层 (Business Layer)</text>

  <!-- Business Layer Items -->
  <rect x="80" y="260" width="120" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="140" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">系统管理</text>

  <rect x="210" y="260" width="120" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="270" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">仓库管理</text>

  <rect x="340" y="260" width="120" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="400" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">物资管理</text>

  <rect x="470" y="260" width="120" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="530" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">资产管理</text>

  <rect x="600" y="260" width="120" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="660" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">巡检管理</text>

  <rect x="730" y="260" width="120" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="790" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">报修管理</text>

  <rect x="860" y="260" width="80" height="45" rx="6" fill="#ffffff" stroke="#b7eb8f"/>
  <text x="900" y="288" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">监控</text>

  <!-- Arrow -->
  <text x="500" y="340" text-anchor="middle" font-family="Arial" font-size="20" fill="#52c41a">⬇ ⬆</text>

  <!-- Service Layer -->
  <rect x="50" y="360" width="900" height="100" rx="8" fill="#fff7e6" stroke="#ffd591"/>
  <text x="80" y="390" font-family="Microsoft YaHei, Arial" font-size="14" fill="#fa8c16">服务层 (Service Layer)</text>

  <!-- Service Layer Items -->
  <rect x="80" y="400" width="130" height="45" rx="6" fill="#ffffff" stroke="#ffd591"/>
  <text x="145" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">Spring Security</text>

  <rect x="220" y="400" width="130" height="45" rx="6" fill="#ffffff" stroke="#ffd591"/>
  <text x="285" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">JWT认证</text>

  <rect x="360" y="400" width="130" height="45" rx="6" fill="#ffffff" stroke="#ffd591"/>
  <text x="425" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">权限控制</text>

  <rect x="500" y="400" width="130" height="45" rx="6" fill="#ffffff" stroke="#ffd591"/>
  <text x="565" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">日志记录</text>

  <rect x="640" y="400" width="130" height="45" rx="6" fill="#ffffff" stroke="#ffd591"/>
  <text x="705" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">数据校验</text>

  <rect x="780" y="400" width="150" height="45" rx="6" fill="#ffffff" stroke="#ffd591"/>
  <text x="855" y="428" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">API接口</text>

  <!-- Arrow -->
  <text x="500" y="480" text-anchor="middle" font-family="Arial" font-size="20" fill="#fa8c16">⬇ ⬆</text>

  <!-- Data Layer -->
  <rect x="50" y="500" width="900" height="80" rx="8" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="80" y="530" font-family="Microsoft YaHei, Arial" font-size="14" fill="#f5222d">数据层 (Data Layer)</text>

  <!-- Data Layer Items -->
  <rect x="80" y="540" width="150" height="30" rx="6" fill="#ffffff" stroke="#ffa39e"/>
  <text x="155" y="560" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">MySQL 5.7+</text>

  <rect x="250" y="540" width="150" height="30" rx="6" fill="#ffffff" stroke="#ffa39e"/>
  <text x="325" y="560" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">Redis 3.0+</text>

  <rect x="420" y="540" width="150" height="30" rx="6" fill="#ffffff" stroke="#ffa39e"/>
  <text x="495" y="560" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">MyBatis ORM</text>

  <rect x="590" y="540" width="150" height="30" rx="6" fill="#ffffff" stroke="#ffa39e"/>
  <text x="665" y="560" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">Druid连接池</text>

  <rect x="760" y="540" width="170" height="30" rx="6" fill="#ffffff" stroke="#ffa39e"/>
  <text x="845" y="560" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#333333">数据备份与恢复</text>
</svg>