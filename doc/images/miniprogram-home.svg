<svg xmlns="http://www.w3.org/2000/svg" width="400" height="750" viewBox="0 0 400 750">
  <!-- Background -->
  <rect width="400" height="750" fill="#f5f6fa"/>

  <!-- Status Bar -->
  <rect width="400" height="44" fill="#ffffff"/>
  <text x="20" y="30" font-family="-apple-system, Arial" font-size="14" font-weight="600" fill="#1a1a1a">9:41</text>
  <text x="320" y="30" font-family="Arial" font-size="11" fill="#1a1a1a">●●●●●</text>
  <text x="365" y="30" font-family="Arial" font-size="12" fill="#1a1a1a">WiFi</text>
  <rect x="380" y="18" width="10" height="12" rx="2" fill="#1a1a1a"/>
  <rect x="392" y="20" width="2" height="8" rx="1" fill="#1a1a1a"/>

  <!-- Banner Section -->
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect y="44" width="400" height="180" fill="url(#bannerGradient)"/>

  <!-- Decorative elements -->
  <circle cx="350" cy="80" r="100" fill="rgba(255,255,255,0.08)"/>
  <circle cx="380" cy="160" r="60" fill="rgba(255,255,255,0.06)"/>

  <!-- Banner Content -->
  <rect x="20" y="60" width="360" height="70" rx="16" fill="rgba(255,255,255,0.95)"/>
  <rect x="36" y="76" width="48" height="48" rx="12" fill="#667eea"/>
  <text x="60" y="108" text-anchor="middle" font-family="Arial" font-size="22" fill="#ffffff"> </text>
  <text x="100" y="98" font-family="-apple-system, Microsoft YaHei, Arial" font-size="17" font-weight="600" fill="#333333">资产管理系统</text>
  <text x="100" y="118" font-family="-apple-system, Microsoft YaHei, Arial" font-size="12" fill="#999999">扫码查询资产信息或进行维护上报</text>

  <!-- Stats Row -->
  <rect x="20" y="150" width="100" height="55" rx="12" fill="rgba(255,255,255,0.9)"/>
  <text x="70" y="172" text-anchor="middle" font-family="Arial" font-size="18" fill="#667eea"> </text>
  <text x="70" y="194" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="11" fill="#333333">资产查询</text>

  <rect x="130" y="150" width="100" height="55" rx="12" fill="rgba(255,255,255,0.9)"/>
  <text x="180" y="172" text-anchor="middle" font-family="Arial" font-size="18" fill="#667eea"> </text>
  <text x="180" y="194" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="11" fill="#333333">PM维护</text>

  <rect x="240" y="150" width="100" height="55" rx="12" fill="rgba(255,255,255,0.9)"/>
  <text x="290" y="172" text-anchor="middle" font-family="Arial" font-size="18" fill="#667eea"> </text>
  <text x="290" y="194" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="11" fill="#333333">故障报修</text>

  <!-- Content Area -->
  <rect y="230" width="400" height="480" fill="#f5f6fa"/>

  <!-- Asset Query Card -->
  <rect x="20" y="245" width="360" height="140" rx="16" fill="#ffffff"/>
  <rect x="36" y="261" width="40" height="40" rx="10" fill="#e6f7ff"/>
  <text x="56" y="287" text-anchor="middle" font-family="Arial" font-size="18" fill="#1890ff"> </text>
  <text x="88" y="278" font-family="-apple-system, Microsoft YaHei, Arial" font-size="15" font-weight="500" fill="#333333">资产查询</text>
  <text x="88" y="298" font-family="-apple-system, Microsoft YaHei, Arial" font-size="12" fill="#999999">扫码或输入编码查询资产详情</text>

