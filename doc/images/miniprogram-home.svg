  <rect x="36" y="421" width="40" height="40" rx="10" fill="#f6ffed"/>
  <text x="56" y="447" text-anchor="middle" font-family="Arial" font-size="18" fill="#52c41a"> </text>
  <text x="88" y="438" font-family="-apple-system, Microsoft YaHei, Arial" font-size="15" font-weight="500" fill="#333333">PM维护上报</text>
  <text x="88" y="458" font-family="-apple-system, Microsoft YaHei, Arial" font-size="12" fill="#999999">定期维护检查并记录上报</text>

  <!-- PM Input Box -->
  <rect x="36" y="475" width="260" height="44" rx="10" fill="#f5f6fa"/>
  <text x="56" y="502" font-family="Arial" font-size="14" fill="#999999"> </text>
  <text x="80" y="502" font-family="-apple-system, Microsoft YaHei, Arial" font-size="14" fill="#999999">输入资产编码</text>

  <!-- PM Button -->
  <defs>
    <linearGradient id="pmBtnGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#52c41a"/>
      <stop offset="100%" style="stop-color:#73d13d"/>
    </linearGradient>
