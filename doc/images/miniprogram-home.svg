  <rect x="308" y="635" width="68" height="44" rx="10" fill="url(#repairBtnGradient)"/>
  <text x="342" y="662" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="14" font-weight="500" fill="#ffffff">报修</text>

  <!-- Repair Scan Button -->
  <rect x="36" y="688" width="328" height="12" rx="6" fill="transparent" stroke="#fa8c16" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="715" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="13" fill="#fa8c16">  扫码报修</text>

  <!-- Footer Text -->
  <text x="200" y="738" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="11" fill="#cccccc">输入编码或扫码操作</text>
</svg>