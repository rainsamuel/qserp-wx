  <text x="56" y="342" font-family="Arial" font-size="14" fill="#999999"> </text>
  <text x="80" y="342" font-family="-apple-system, Microsoft YaHei, Arial" font-size="14" fill="#999999">输入资产编码</text>

  <!-- Query Button -->
