  <rect x="36" y="528" width="328" height="12" rx="6" fill="transparent" stroke="#52c41a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="555" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, Arial" font-size="13" fill="#52c41a">  扫码上报</text>

  <!-- Repair Card -->
  <rect x="20" y="565" width="360" height="140" rx="16" fill="#ffffff"/>
  <rect x="36" y="581" width="40" height="40" rx="10" fill="#fff7e6"/>
  <text x="56" y="607" text-anchor="middle" font-family="Arial" font-size="18" fill="#fa8c16"> </text>
  <text x="88" y="598" font-family="-apple-system, Microsoft YaHei, Arial" font-size="15" font-weight="500" fill="#333333">故障报修</text>
  <text x="88" y="618" font-family="-apple-system, Microsoft YaHei, Arial" font-size="12" fill="#999999">设备故障快速报修处理</text>

  <!-- Repair Input Box -->
  <rect x="36" y="635" width="260" height="44" rx="10" fill="#f5f6fa"/>
  <text x="56" y="662" font-family="Arial" font-size="14" fill="#999999"> </text>
  <text x="80" y="662" font-family="-apple-system, Microsoft YaHei, Arial" font-size="14" fill="#999999">输入资产编码（选填）</text>

  <!-- Repair Button -->
  <defs>
    <linearGradient id="repairBtnGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fa8c16"/>
      <stop offset="100%" style="stop-color:#ffa940"/>
    </linearGradient>
