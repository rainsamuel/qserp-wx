<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" fill="#303133">报修流程图</text>

  <!-- Start -->
  <ellipse cx="100" cy="100" rx="60" ry="30" fill="#409eff"/>
  <text x="100" y="105" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#ffffff">开始</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="100" x2="220" y2="100" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Submit Repair -->
  <rect x="220" y="75" width="120" height="50" rx="6" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="280" y="105" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">提交报修</text>

  <!-- Arrow 2 -->
  <line x1="340" y1="100" x2="400" y2="100" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Pending -->
  <rect x="400" y="75" width="100" height="50" rx="6" fill="#fff7e6" stroke="#ffd591"/>
  <text x="450" y="105" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">待处理</text>

  <!-- Arrow 3 -->
  <line x1="500" y1="100" x2="560" y2="100" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Process -->
  <rect x="560" y="75" width="100" height="50" rx="6" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="610" y="105" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">处理中</text>

  <!-- Arrow 4 -->
  <line x1="660" y1="100" x2="720" y2="100" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Complete -->
  <rect x="720" y="75" width="80" height="50" rx="6" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="760" y="105" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">已完成</text>

  <!-- End -->
  <ellipse cx="760" cy="180" rx="60" ry="30" fill="#67c23a"/>
  <text x="760" y="185" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#ffffff">结束</text>

  <!-- Arrow from Complete to End -->
  <line x1="760" y1="125" x2="760" y2="150" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Reject Branch -->
  <line x1="450" y1="125" x2="450" y2="250" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="390" y="250" width="120" height="50" rx="6" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="450" y="280" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">已驳回</text>

  <!-- Cancel Branch -->
  <line x1="280" y1="125" x2="280" y2="250" stroke="#909399" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="220" y="250" width="120" height="50" rx="6" fill="#f5f5f5" stroke="#d9d9d9"/>
  <text x="280" y="280" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#333333">已取消</text>

  <!-- Description -->
  <text x="400" y="350" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" fill="#606266">报修状态说明：</text>
  <text x="100" y="380" font-family="Microsoft YaHei, Arial" font-size="12" fill="#606266">• 待处理：报修已提交，等待处理</text>
  <text x="100" y="400" font-family="Microsoft YaHei, Arial" font-size="12" fill="#606266">• 处理中：已指派维修人员，正在维修</text>
  <text x="100" y="420" font-family="Microsoft YaHei, Arial" font-size="12" fill="#606266">• 已完成：维修已完成</text>
  <text x="100" y="440" font-family="Microsoft YaHei, Arial" font-size="12" fill="#606266">• 已驳回：报修被驳回</text>
  <text x="100" y="460" font-family="Microsoft YaHei, Arial" font-size="12" fill="#606266">• 已取消：报修已取消</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#909399"/>
    </marker>
  </defs>
</svg>